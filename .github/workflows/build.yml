name: Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-app:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore SpeedScanManager.csproj

    - name: Build
      run: dotnet build SpeedScanManager.csproj --configuration Release --no-restore

    - name: Publish (self-contained)
      run: dotnet publish SpeedScanManager.csproj -c Release -r win-x86 --self-contained true -o dist

    - name: Upload app artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpeedScanManager-app
        path: dist/

  build-installer:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore installer dependencies
      run: dotnet restore installer/SpeedScanInstaller.csproj

    - name: Build installer
      run: dotnet build installer/SpeedScanInstaller.csproj --configuration Release --no-restore

    - name: Publish installer (self-contained)
      run: dotnet publish installer/SpeedScanInstaller.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -o dist-installer

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpeedScanManager-installer
        path: dist-installer/

  deploy-pages:
    runs-on: ubuntu-latest
    needs: [build-app, build-installer]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: .github/pages

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
