name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Same build as locally: publishes the app, zips it and builds the installer
    # with the zip embedded as payload (see build-release.ps1).
    - name: Build release (app zip + installer)
      shell: pwsh
      run: ./build-release.ps1

    - name: Upload portable zip
      uses: actions/upload-artifact@v4
      with:
        name: SpeedScanManager-portable
        path: release/v*/*-portable-win-x86.zip
        if-no-files-found: error

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: SpeedScanManager-installer
        path: release/v*/*-Setup-win-x86.exe
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # The artifacts keep their release/vX.Y.Z folder: upload the files, not the folder
        gh release create "$GITHUB_REF_NAME" $(find artifacts -type f) \
          --repo "$GITHUB_REPOSITORY" \
          --title "SpeedScan Manager $GITHUB_REF_NAME" \
          --generate-notes

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: .github/pages

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
